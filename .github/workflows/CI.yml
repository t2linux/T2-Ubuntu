---
name: CI
# yamllint disable-line rule:truthy
on:
  [push, workflow_dispatch]

jobs:
  ISO-Kubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Free up disk space for the CI
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'

      - name: Generate Tag
        id: tag
        run: |
          VER=$(egrep ^KERNEL_VERSION build.sh|cut -d= -f2)
          REL=$(egrep ^PKGREL build.sh|cut -d= -f2)
          echo Version is ${VER}-${REL}
          echo "kver=${VER}" >> $GITHUB_ENV
          echo "isotag=${VER}-${REL}" >> $GITHUB_ENV
  
      - name: Run build script
        run: |
          chmod +x ${{ github.workspace }}/build_in_docker.sh
          ${{ github.workspace }}/build_in_docker.sh kubuntu

      - name: print sha256sum
        run: |
          cat ${{ github.workspace }}/output/sha256*
          SHA256=$(cat ${{ github.workspace }}/output/sha256* | cut -d " " -f 1)
          echo "sha256=${SHA256}" >> $GITHUB_ENV
  
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ISO-Kubuntu
          path: ${{ github.workspace }}/output/kubuntu-24.04-${{ env.kver }}-t2-noble.iso
          archive: false

      - name: Remove unsplit ISO and get instructions.txt
        run: |
          sudo rm ${{ github.workspace }}/output/*.iso
          cd ${{ github.workspace }}
          wget https://raw.githubusercontent.com/t2linux/T2-Ubuntu/refs/heads/LTS/.github/workflows/instructions.txt

      - name: Release
        #if: github.ref == 'refs/heads/flavourLTS'
        #uses: softprops/action-gh-release@v2
        #with:
        #  files: ${{ github.workspace }}/output/*
        #  tag_name: v${{ env.isotag }}
        #  body_path: ${{ github.workspace }}/instructions.txt
        #  draft: false
        #  prerelease: false
        run: |
          gh release view v${{ env.isotag }} -R t2linux/T2-Ubuntu || \
          gh release create v${{ env.isotag }} -t v${{ env.isotag }} -F ${{ github.workspace }}/instructions.txt -R t2linux/T2-Ubuntu
          gh release upload v${{ env.isotag }} ${{ github.workspace }}/output/* --clobber -R t2linux/T2-Ubuntu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the json
        if: github.ref == 'refs/heads/flavourLTS'
        run: |
          git clone https://github.com/t2linux/wiki.git
          cd wiki/docs/tools

          cat << EOF > update.py
          import json
          # Define the new links
          new_link1 = "https://github.com/t2linux/T2-Ubuntu/releases/download/v${{ env.isotag }}/kubuntu-24.04-${{ env.kver }}-t2-noble.iso.00"
          new_link2 = "https://github.com/t2linux/T2-Ubuntu/releases/download/v${{ env.isotag }}/kubuntu-24.04-${{ env.kver }}-t2-noble.iso.01"
          new_link3 = "https://github.com/t2linux/T2-Ubuntu/releases/download/v${{ env.isotag }}/kubuntu-24.04-${{ env.kver }}-t2-noble.iso.02"
          # Load the JSON file
          with open('distro-metadata.json', 'r') as file:
              data = json.load(file)
          # Function to update the links
          def update_links(distros, name, new_links, sha256):
              for distro in distros:
                  if distro['name'] == name:
                      distro['iso'] = new_links
                      distro['sha256'] = sha256
          # Update the links
          update_links(data['all'], "Kubuntu 24.04 - Noble Numbat", [new_link1, new_link2, new_link3], "${{ env.sha256 }}")
          # Save the updated JSON back to the file
          with open('distro-metadata.json', 'w') as file:
              json.dump(data, file, indent=2)
          print("Links updated successfully.")
          EOF

          python3 update.py
          rm update.py
          cd -

      - name: Push updated links to t2linux.org
        if: github.ref == 'refs/heads/flavourLTS'
        uses: cpina/github-action-push-to-another-repository@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.PAT }}
        with:
          source-directory: 'wiki'
          destination-github-username: 't2linux'
          destination-repository-name: 'wiki'
          user-email: github-actions[bot]@users.noreply.github.com
          user-name: github-actions[bot]
          target-branch: master
          commit-message: Distro metadata - Update Kubuntu 24.04 to v${{ env.isotag }}

